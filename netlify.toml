# Configuration Netlify — site statique + fonctions serverless (espace admin)
# Le site reste 100 % statique ; seules les fonctions /api/* touchent Airtable
# côté serveur (le token n'est jamais exposé au navigateur).

[build]
  publish = "."
  functions = "netlify/functions"

# Pinne Node 20 pour les fonctions (le « fetch » global y est disponible).
[build.environment]
  NODE_VERSION = "20"

# Unification du branding : les visiteurs qui arrivent encore sur l'ancienne URL
# Netlify (liens historiques, emails déjà envoyés, favoris) sont redirigés vers
# le domaine officiel. 301 = permanent (les moteurs de recherche mettent à jour
# leur index), force = true = s'applique même si un fichier statique existe.
[[redirects]]
  from = "https://nouvellevieenchrist-pdvie-vdh-mks2026.netlify.app/*"
  to = "https://nouvellesviesenjesus.fr/:splat"
  status = 301
  force = true

# Jolies URLs : /api/admin-login  ->  /.netlify/functions/admin-login
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# En-têtes de sécurité de base sur tout le site
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# L'espace admin ne doit pas être indexé
[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
